<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title></title>
    <link href="QueryAddrTGOSMap.css" rel="stylesheet" type="text/css" />

    <script type="text/javascript" src="https://code.jquery.com/jquery-latest.js"></script>

    <!-- 載入操作 TGOS MAP 函式 -->

            </div>

        </div>

            <a target="_blank" href="https://www.tgos.tw">https://www.tgos.tw</a>
